<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAREFA DESIGN WEB</title>
</head>
<body>
    <h1>TAREFA - DESIGN WEB</h1>
    
    <h2>Números de -10 à 10</h2>
    <p id="resultado"></p>

    <script>
        for (let i = -10; i <= 10; i++) {
            document.write(i + "<br>");
        }
    </script>

    <h2>Cores</h2>
    <p id="resultado1"></p>
    <script>
        const cores = ["purple", "pink", "blue", "yellow", "red", "green", "black"];

        let resultado1 = document.getElementById("resultado1");

        for (let i = 0; i < cores.length; i++) {
            resultado1.innerHTML += "<span style='color:" + cores[i] + "'>" + "Jennyfe" + "</span><br>";
        };
    </script>

    <h2>Números com tamanhos distintos</h2>
    <p id="resultado2"></p>

    <script>
       
        const resultado2 = document.getElementById("resultado2");

        for(let i = 0; i<6 ; i++){
            resultado2.innerHTML+= `<span style='font-size:${i}rem'>${i}</span> <br>`
        }
    </script>

    <h2>Imprimir nome 5 vezes</h2>
    

    <label>
        Nome: <input type="text" id="nome"> <br> <br>
        <button id="gerar">GERAR</button>
        <p id="textoformatado"></p>
    </label>

    <p id="resultado3"></p>

    <script>
        let gerar = document.querySelector("#gerar");
    
        gerar.addEventListener("click", function(e) {
            let nome = document.querySelector("#nome").value;
            for(let i = 0; i<6 ; i++){
                resultado3.innerHTML+= `<span style='font-size:${i}rem'>${nome}</span> <br>`
            }
        
        });
    </script>

    <h2>Alterar tamanho da fonte</h2><br>

    <button id="aumentar">AUMENTAR</button>
    <button id="diminuir">DIMINUIR</button>

    <script>

        let aumentar = document.getElementById("aumentar");
        let diminuir = document.getElementById("diminuir");

        aumentar.addEventListener("click", function(e) {
            document.body.style.fontSize = "2rem";
        });
        diminuir.addEventListener("click", function(e) {
            document.body.style.fontSize = "0.5rem";
        });

    </script>
</body>
</html>
