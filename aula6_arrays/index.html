<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT: ARRAYS E MATH</title>
</head>
<body>
    <h1>ARRAYS e MATH</h1>
    <h2>Arrays</h2>

    <script>
        //Arrays é uma lista de itens
        //criação
        const nums = [4, 6, 8, 9]
        const alunos = ["José", "Arthur", "Isabella", "Isadora"]

        const frutas = []
        frutas[0] = "Mamão";
        frutas[1] = "Goiaba";

        const lanche = new Array("Biscoito", "Bolo", "Macarrão");
    </script>
    <p id="resultado"></p>
    <script>
        let resultado = document.getElementById("resultado");

        // acessar um valor passando um índice - 6a posição
        resultado.innerHTML = alunos[3];

        //imprimir a lista em formato de texto
        resultado.innerHTML = alunos.toString();

        //gera uma lista em formato JSON
        resultado.innerHTML = JSON.stringify(alunos);

        //número total de itens da lista
        resultado.innerHTML = alunos.legth;

        //retorna o penúltimo número
        resultado.innerHTML = alunos[alunos.length - 1];

        //ordenação
        resultado.innerHTML = alunos.sort();

        //adicionar valores
        resultado.innerHTML = alunos.push("Isis"); //retorna comprimento 
        resultado.innerHtml = alunos.toString();

        //remover pop
        resultado.innerHTML = alunos.pop(); //retorna o valor do item removido
        resultado.innerHTML = alunos.toString();

        //separador para os itens
        resultado.innerHTML = alunos.join(" - ");
    </script>
    <h2>Math</h2>
    <p id="resultado2"></p>
    <script>
        let resultado2 = document.getElementById("resultado2");

        //arredonda para o mais próximo
        resultado2.innerHTML = "Arredonda o valor 'round': " + Math.round(5.3);

        // .ceil(5.4) - arredonda para cima      
        // .floor(5.7) - arredonda para baixo

        resultado2.innerHTML = Math.min(5, 10, 15, 20); //retorna o menor valor
        resultado2.innerHTML = Math.max(5, 10, 15, 20); //retorna o maior valor

        //gera um número aleatório entre 0 e 1
        resultado2.innerHTML = Math.random();

        //gera um número aleatório entre 0 e 10
        resultado2.innerHTML = Math.floor(Math.random() * 10);

        //retorna o valor absoluto
        resultado2.innerHTML = Math.abs(-5);

        
    </script>

    <label>
        Nome: <input type="text" id="nome"> <br>

        <p id="textoformatado"></p>

        gerar.addEventListener("click", function(e) {

            // document.querySelector("#textoformatado").style.color = coresAleatorias;
            document.querySelector("#textoformatado").innerHTML =  nome;
        
        });
    
    </script>
</body>
